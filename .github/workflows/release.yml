name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine bump type from PR labels
        id: bump
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          BUMP=""
          if echo "$LABELS_JSON" | grep -q "release:major"; then
            BUMP="major"
          elif echo "$LABELS_JSON" | grep -q "release:minor"; then
            BUMP="minor"
          elif echo "$LABELS_JSON" | grep -q "release:patch"; then
            BUMP="patch"
          fi
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Skip (no release label)
        if: steps.bump.outputs.type == ''
        run: echo "PR sin label release:major/minor/patch — no se corta release."

      - name: Compute next version
        if: steps.bump.outputs.type != ''
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v0.1.0"
          else
            VERSION="${LAST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            case "$BUMP_TYPE" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG
        if: steps.bump.outputs.type != ''
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          {
            echo ""
            echo "## ${NEW_TAG} - ${DATE}"
            echo "- ${PR_TITLE} (#${PR_NUMBER})"
          } >> CHANGELOG.md

      - name: Bump package.json version
        if: steps.bump.outputs.type != ''
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      - name: Commit changelog and package.json
        if: steps.bump.outputs.type != ''
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "docs: actualizar changelog y version para ${NEW_TAG}"
          git push origin main

      - name: Create tag
        if: steps.bump.outputs.type != ''
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Release
        if: steps.bump.outputs.type != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
