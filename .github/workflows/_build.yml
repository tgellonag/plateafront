name: _build

on:
  workflow_call:
    inputs:
      api-url:
        description: Public backend URL inlined at build time (NEXT_PUBLIC_API_URL)
        type: string
        default: http://localhost:8080

permissions:
  contents: read

jobs:
  build:
    name: Build · next build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm ci

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api-url }}
          NEXT_TELEMETRY_DISABLED: "1"
