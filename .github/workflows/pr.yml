# CI de pull requests: quality, tests con cobertura y SAST. El build lo hace Vercel (preview).
# Trivy corre en security.yml (semanal y PRs que cambian dependencias).
name: CI · PR

on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yml

  test:
    name: Test
    uses: ./.github/workflows/_test.yml

  semgrep:
    name: SAST
    uses: ./.github/workflows/_semgrep.yml
