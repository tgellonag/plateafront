# Escaneo de seguridad: Semgrep (SAST) y Trivy fs (dependencias, secretos y misconfig).
# Corre semanalmente (los CVE aparecen aunque el código no cambie) y en los PR que cambian
# las dependencias.
name: Security scan

on:
  schedule:
    - cron: "0 10 * * 1" # lunes 10:00 UTC
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/security.yml
      - .github/workflows/_trivy.yml
      - .github/workflows/_semgrep.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: SAST
    uses: ./.github/workflows/_semgrep.yml

  trivy:
    name: SCA
    uses: ./.github/workflows/_trivy.yml
    with:
      severity: HIGH,CRITICAL
      warn-severity: MEDIUM
