# CI de main y de tags v*: quality y tests. SAST corre en el PR; Trivy en security.yml.
name: CI · Main

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yml

  test:
    name: Test
    uses: ./.github/workflows/_test.yml

  # CD: no hay job de deploy. Vercel construye y despliega solo desde main (y un preview en
  # cada PR, que aparece como check "Vercel").
