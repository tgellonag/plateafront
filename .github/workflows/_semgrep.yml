name: _semgrep

on:
  workflow_call:

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST · Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep scan
        run: >-
          semgrep scan
          --config p/typescript
          --config p/javascript
          --config p/react
          --config p/nextjs
          --config p/secrets
          --error
          --metrics off
