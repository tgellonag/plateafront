# CI de la rama development: quality y tests. SAST corre en el PR; Trivy en security.yml.
name: CI · Development

on:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yml

  test:
    name: Test
    uses: ./.github/workflows/_test.yml
