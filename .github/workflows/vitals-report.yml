# Monitoreo diario de Core Web Vitals reales: lee el resumen del backend (el mismo de /vitals), lo deja en el
# Job Summary y abre, actualiza o cierra un issue según el p75 de LCP, INP y CLS. También se puede
# lanzar a mano desde la pestaña Actions, opcionalmente para una sola versión.
name: Monitoreo · Core Web Vitals

on:
  schedule:
    - cron: "0 12 * * *" # todos los días 12:00 UTC
  workflow_dispatch:
    inputs:
      release:
        description: "Versión (SHA corto del commit) a revisar; vacío = todas. Con una versión no se toca el issue."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: Reporte
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resumen de Core Web Vitals
        id: report
        env:
          # URL pública del backend; se puede cambiar con la variable de repositorio API_URL.
          API_URL: ${{ vars.API_URL || 'https://plateaback.onrender.com' }}
          RELEASE: ${{ inputs.release }}
        run: node scripts/vitals-report.mjs

      # Con una versión filtrada se ve una parte de los datos: no debe abrir ni cerrar el issue general.
      - name: Abrir, actualizar o cerrar el issue
        if: github.event_name == 'schedule' || inputs.release == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.report.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="web-vitals"
          title="Core Web Vitals fuera de «bueno» en producción"
          number=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          case "$STATUS" in
            problems)
              if [ -n "$number" ]; then
                gh issue edit "$number" --body-file vitals-issue.md
              else
                gh label create "$label" --color d93f0b --description "Alertas de Core Web Vitals" 2>/dev/null || true
                gh issue create --title "$title" --label "$label" --body-file vitals-issue.md
              fi
              ;;
            ok)
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "Todas las mediciones con muestras suficientes volvieron a «bueno»: se cierra solo. $RUN_URL"
                gh issue close "$number" --reason completed
              fi
              ;;
            *)
              echo "Datos insuficientes: no se abre ni se cierra ningún issue."
              ;;
          esac
